<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/upload.css') }}">
    <title>Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" charset="utf-8"></script>
</head>
<body style="background: #0e0d0d;">
    <audio src = "" id = "audio"></audio>
    <!--left bar-->
    <div class="square" style="background-color: #282424; height: 100vh; width: 15%;">
        <div class ="side-buttons">
          <button type="submit" style="width: 200px; height: 50px; position: relative; left: 23px; font-family: spof; font-size: 20px; border-radius: 20px; top: 90px;"onclick="location.href='/artistdash/dashboard'">
            Home
          </button>
        </div>
        <div class ="side-buttons">
          <button type="submit" style="width: 200px; height: 50px; position: relative; left: 23px; font-family: spof; font-size: 20px; border-radius: 20px; top: 100px;">
            Stats
          </button>
        </div>
        <!--button 3-->
        <div class ="side-buttons">
          <button type="submit" style="width: 200px; height: 50px; position: relative; left: 23px; font-family: spof; font-size: 20px; border-radius: 20px; top: 110px;" onclick="location.href='/artistdash/dashboard'">
            Discover
          </button>
        </div>
        <!--button 4-->
        <div class ="side-buttons">
          <button type="submit" style="width: 200px; height: 50px; position: relative; left: 23px; font-family: spof; font-size: 20px; border-radius: 20px; top: 120px;" onclick="location.href='/artistdash/upload'">
            Upload
          </button>
        </div>      
    </div>
     <!--top bar-->
    </div>
    <!--main board-->
    <div class="square" style="overflow: hidden; background-color: inherit; height: 83vh; width: 75%; position: absolute; right: 10%; top: 0; display: flex; flex-direction: column; justify-content: flex-start; align-items: center; gap: 30px; padding-top: 40px; overflow-y: scroll;">
        <div class="form-container" style="position: relative; top: 100px;">
            <form action="/artistdash/upload" method="POST" enctype="multipart/form-data" class="upload-form">
                <div class="radio-buttons">
                    <label>
                        <input type="radio" name="uploadType" value="single" required>
                        Upload Song Without Album
                    </label>
                    <label>
                        <input type="radio" name="uploadType" value="album" required>
                        Upload Song With Album
                    </label>
                </div>
    
                <div class="single-song" id="singleSongUpload">
                    <label for="songFile">Select a Song (MP3 only):</label>
                    <input type="file" id="songFile" name="songFile" accept=".mp3">
                </div>
    
                <div class="album-upload" id="albumUpload" style="display: none;">
                    <label for="albumTitle">Album Title:</label>
                    <input type="text" id="albumTitle" name="albumTitle" placeholder="Enter album title">
    
                    <label for="albumType">Album Type:</label>
                    <select id="albumType" name="albumType">
                        <option value="single">Single</option>
                        <option value="double">Double</option>
                        <option value="mixed">Mixed</option>
                        <option value="custom">Custom</option>
                    </select>
    
                    <label for="albumSongs">Upload Songs (MP3 only):</label>
                    <input type="file" id="albumSongs" name="albumSongs[]" accept=".mp3" multiple>
                </div>
    
                <button type="submit" class="submit-button">Upload</button>
            </form>
        </div>
    </div>
    

    <!--right bar-->
    <div class="square" style="background-color: #282424; height: 100vh; width: 15%; position: absolute; right: 0; top: 0; display: flex; flex-direction: column; justify-content: flex-start; align-items: center;">
      
</div>
  <!--music player-->
  <div class="square" style="background-color: linear-gradient(to top,#000000, #474747 50%, #555454); height: 150px; width: 100%; position: absolute; bottom:0; backdrop-filter: blur(20px); 
    -webkit-backdrop-filter: blur(10px); border-top-left-radius: 15px; border-top-right-radius: 15px; border-top: 1px solid rgb(203, 222, 221);">
    <div class="song-slider" style="position: absolute; top: 22%; left: 50%; transform: translate(-50%, -50%); width: 60%; max-width: 300px;">
        <input type="range" value="0" class="seek-bar" style="width: 100%;">
        <span class="current-time">00:00</span>
        <span class="song-time">00:00</span>
    </div>
    
</div>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const singleSongUpload = document.getElementById("singleSongUpload");
        const albumUpload = document.getElementById("albumUpload");
        const radioButtons = document.querySelectorAll("input[name='uploadType']");
    
        radioButtons.forEach(radio => {
            radio.addEventListener("change", function() {
                if (this.value === "single") {
                    singleSongUpload.style.display = "block";
                    albumUpload.style.display = "none";
                } else {
                    singleSongUpload.style.display = "none";
                    albumUpload.style.display = "block";
                }
            });
        });
    });
    </script>
    
</body>
</html>

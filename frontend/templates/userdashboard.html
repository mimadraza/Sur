<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/userdashboard.css') }}">
    <title>Dashboard</title>
</head>
<body style="background-color: black;">
  <audio src = "" id = "audio"></audio>
  <div class="grid">
    <header>
        <div class="section"></div>
        <div class="section">
          <button class="circle-image" style="width:80px; height:80px; position: absolute; left: 0;background-image: url('static/images/icons8-home-24.png');" onclick="window.location.href='/userdash/dashboard'">
          </button>
          <div class="search" style="background-color: #282424; height:60px; width: 75%; position: absolute; border-radius: 10px; position: absolute; right: 0;">
            <div class="symbol"></div>
            <div class="line"></div>
            <form action="/userdash/search" method="POST">  
            <input type="text" name="search" placeholder="Search music, artist, album..." style="position: relative;left: 35px;bottom:25px;font-family: spof2;" />
            </form>
          </div>
        </div>
        <div class="section"><div class="circle-image" style="width:80px; height:80px; position: absolute; right: 0; background-image: url('../static/images/user.jpg');">
        </div></div>
    </header>

    <aside class="sidebar-left" style="display: flex; flex-direction: column;padding: 0; gap:2%">

        <div style="color:white; width: inherit; height: 10%; border-top-left-radius: 10px; border-top-right-radius: 10px;box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5); display: flex; flex-direction: row;">
              <h1 style="font-family: spof;">
                  Your Library
              </h1>
        </div>
        <div style="display: flex;flex-direction: column; width: inherit; height: 100%;gap: 10px; align-items: center;">
          {% for song in artist_data.songs %}
          <button class="playlist" onclick="loadAlbum('{{ song.title }}')">
              <div class="playlist-image" style="background-image: url('{{ song.image_url }}'); margin-top: 1%;" onclick="playSong('Song 1')">
              </div>
              <div class="song-title" style="text-align: center; position: relative; top: 45%;">{{ song.title }}</div>
              <i class="fas fa-play"></i> <!-- Play Icon -->
            </button> 
        {% endfor %}
        </div>
    </aside>
  
    <div class = "main-dash glass">
      <div style="width: inherit;height: inherit; display: grid;
      grid-template-columns: 50% 50%;
      grid-template-rows:33% 33% 33%;padding: 5px 5px; gap: 10px;">
        {% for song in artist_data.songs %}
            <button class="song glass" style="display:flex; flex-direction: row; width: inherit;height: 100%; padding: 0;">
                <div class="song-5" style="align-self: left;background-image: url('{{ song.image_url }}'); background-size: cover; background-position: center; width: 20%;height: 100%; " onclick="playSong('20')">
                </div>
                <div style="margin-top: 7%;margin-left: 1%;">
                <div class="song-title" style="flex-grow: 1; text-align: center;">{{ song.title }}</div>
            </div>
          </button> 
        {% endfor %}
      </div>
      <div style="text-align: left; margin-left: 2%;">
        <h1 style="font-family: spof;color: white;"> Made For You </h1>
      </div>
      <div style="width: inherit; height: 100%; display: grid; 
        grid-template-columns: repeat(5, 1fr); /* Five equal columns */
        grid-template-rows: auto; /* Allow rows to size automatically */
        gap: 5px; /* Add spacing between grid items */
        align-items: center;
        justify-items: center;">
        {% for album in artist_data.albums %}
          <button class="album" style="display: flex; flex-direction: column; text-align: center; align-items: center; padding: 10px; border-radius: 10px; background-color: transparent; color: inherit; border: none; height: 250px; width: 200px;" onclick="loadAlbum('{{ album.title }}')">
              <div class="song-image" style="background-image: url('{{ album.image_url }}'); 
                  background-size: cover; background-position: center; 
                  width: 90%; height: 100%;
                  border-radius: 10px; /* Rounded corners */
                  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5); /* Border shadow */
                  transition: box-shadow 0.3s ease; /* Smooth hover effect */">
              </div>
              <div class="song-text" style="font-family: spof; color: #ffffff; margin-top: 10px;">
                  <p>{{ album.title }}</p>
              </div>
          </button>
      {% endfor %}  

</div>

      <div style="text-align: left; margin-left: 2%;">
        <h1 style="font-family: spof;color: white;"> Revisit </h1>
      </div>
      <div style="width: inherit;height: 200px; display: grid; 
        grid-template-columns: 20% 20% 20% 20% 20%;
        grid-template-rows: 200px;">
        {% for album in artist_data.albums %}
        <button class="album" style="display: flex; flex-direction: column; text-align: center; align-items: center; padding: 10px; border-radius: 10px; background-color: transparent; color: inherit; border: none; height: 250px; width: 200px;" onclick="loadAlbum('{{ album.title }}')">
            <div class="song-image" style="background-image: url('{{ album.image_url }}'); 
                background-size: cover; background-position: center; 
                width: 90%; height: 100%;
                border-radius: 10px; /* Rounded corners */
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5); /* Border shadow */
                transition: box-shadow 0.3s ease; /* Smooth hover effect */">
            </div>
            <div class="song-text" style="font-family: spof; color: #ffffff; margin-top: 10px;">
                <p>{{ album.title }}</p>
            </div>
        </button>
  {% endfor %}
        </div>

    </div>
  
    <aside class="sidebar-right">
     
    </aside>
    
    <footer style="display: flex; flex-direction: row;">
      <div style="height: 100%; width: 22.5%;">


      </div>
      <div style="height: 100%; width: 55%; margin-top: 1%; align-items: center;">
        <div class="controls">
          <button class="btn backward-btn" style="position: relative;bottom: 30px;"><img src="{{ url_for('static', filename='images/prev.png') }}" alt = ""></button>
          <button class="play-btn pause" style="bottom: 30px;" >
              <span></span>
              <span></span>
          </button>
          <button class="btn backward-btn" style="position: relative;bottom: 30px;"><img src="{{ url_for('static', filename='images/next.png') }}"" alt = ""></button>
        </div>
        <div class="song-slider" style="bottom:20%;width: 50%; align-self: center;">
          <input type="range" value="0" class="seek-bar" style="width: 100%;">
          <span class="current-time">00:00</span>
          <span class="song-time">00:00</span>
        </div>
      </div>
      <div style="display:flex; flex-direction: row; height: 100%; width: 22.5%;">

      </div>
    </footer>
    
  </div>
  <script src="{{ url_for('static', filename='js/data.js') }}"></script>
  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
  <script>     function loadAlbum(albumName) {
        // Use the album name to create a URL
        location.href = `/userdash/album?album_name=${encodeURIComponent(albumName)}`;
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="static/css/loginstyle.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="background: linear-gradient(to top,#000000, #222222 50%, #333333);
height: 100vh;
margin: 0;">
    <div class="square" style="background-color: #161515; height: 800px; width: 1200px; top: 150px; left: 50%; transform: translateX(-50%); border-radius: 30px; box-shadow: 10px 10px 15px rgba(0, 0, 0, 0.3); position: relative; font-family: 'CustomFont', sans-serif;">
        
        <h1 style="font-family: spof; color: white; font-size: 4.5cqmax; text-align: right; position: absolute; top: 20px; left: 750px;">
            Welcome
        </h1>
        
        <div class="gradient-container" style="height: 750px; width: 700px; top: 25px; left: 20px; position: absolute;">
            <img src="static/images/سُر_no_background (1).png" style="height: 300px; width: 300px; position: absolute; top: 210px; left: 180px;">
        </div>
     
        <div class="form-container" style="position: relative; left: 810px; top: 250px;">
            <!-- Login Form -->
            <form action="/login" method="POST">
                <div class="input-group">
                    <input type="email" id="email" name="email" required style="font-family: spof;">
                    <label for="email" style="font-family: spof;font-size: 20px;">Email</label>
                </div>
                
                <div class="input-group">
                    <input type="password" id="password" name="password" required style="font-family: spof;">
                    <label for="password" style="font-family: spof;font-size: 20px;">Password</label>
                    <span class="toggle-password" onclick="togglePassword()">◉</span>
                </div>
                
                <button type="submit" style="width: 300px; height: 50px; position: relative;left: 5px;font-family: spof;font-size: 20px; border-radius: 20px;">
                    Login
                </button>
            </form>

            <!-- Sign-Up Form -->
            <div style="position: relative; top: 20px; left: 40px;">
                <a style="color: #ffffff; font-family: spof;">
                    Need an Account?
                </a>
                <a href="/register" style="color: #be6efb; font-size: 16px; text-decoration: none;font-family: spof;text-decoration: underline;">
                    Sign-Up here
                </a>
            </div>
        </div>
    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
        }
    </script>
</body>
</html>

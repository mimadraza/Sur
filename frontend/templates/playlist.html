<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/userdashboard.css') }}">
    <title>Dashboard</title>
</head>
<body style="background-color: black;">
  <audio src = "" id = "audio"></audio>
  <div class="grid">
    <header>
        <div class="section"></div>
        <div class="section">
          <button class="circle-image" style="width:80px; height:80px; position: absolute; left: 0;background-image: url('static/images/icons8-home-24.png');" onclick="window.location.href='/userdash/dashboard'">
          </button>
          <div class="search" style="background-color: #282424; height:60px; width: 75%; position: absolute; border-radius: 10px; position: absolute; right: 0;">
            <div class="symbol"></div>
            <div class="line"></div>
            <form action="/userdash/search" method="POST">  
            <input type="text" name="search" placeholder="Search music, artist, album..." style="position: relative;left: 35px;bottom:25px;font-family: spof2;" />
            </form>
          </div>
        </div>
        <div class="section"><div class="circle-image" style="width:80px; height:80px; position: absolute; right: 0; background-image: url('../static/images/user.jpg');">
        </div></div>
    </header>

    <aside class="sidebar-left" style="display: flex; flex-direction: column;padding: 0; gap:2%">

        <div style="color:white; width: inherit; height: 10%; border-top-left-radius: 10px; border-top-right-radius: 10px;box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);">
              <h1 style="font-family: spof;">
                  Your Library
              </h1>
        </div>
        <div style="display: flex;flex-direction: column; width: inherit; height: 100%;gap: 10px; align-items: center;">
          {% for song in artist_data.songs %}
          <button class="playlist" onclick="loadAlbum('{{ song.title }}')">
              <div class="playlist-image" style="background-image: url('{{ song.image_url }}'); margin-top: 1%;" onclick="playSong('Song 1')">
              </div>
              <div class="song-title" style="text-align: center; position: relative; top: 45%;">{{ song.title }}</div>
              <i class="fas fa-play"></i> <!-- Play Icon -->
            </button> 
        {% endfor %}
        </div>
    </aside>
  
    <div class="main-dash glass" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;">
        <!-- Playlist Header -->
        <h1 style="color: white; font-family: spof;">Create a Playlist</h1>
    
        <!-- Playlist Form -->
        <form id="playlistForm" style="display: flex; flex-direction: column; gap: 15px; align-items: center; width: 80%;">
            <input type="text" id="playlistName" placeholder="Enter Playlist Name" style="width: 100%; padding: 10px; background: #333; color: white; border-radius: 5px;">
    
            <!-- Search Bar -->
            <input type="text" id="songSearch" placeholder="Search for songs..." 
                   style="width: 100%; padding: 10px; background: #444; color: white; border-radius: 5px;">
    
            <!-- Results Container -->
            <div id="songResults" style="width: 100%; max-height: 150px; overflow-y: auto; background: #222; color: white; border-radius: 5px; padding: 10px;">
                <!-- Dynamic song results will appear here -->
            </div>
    
            <!-- Selected Songs -->
            <div id="selectedSongs" style="width: 100%; background: #333; color: white; border-radius: 5px; padding: 10px; font-family: spof;">
                <h3 style="margin-bottom: 10px;">Selected Songs:</h3>
                <ul id="songListDisplay" style="list-style: none; padding: 0;"></ul>
            </div>
    
            <!-- Submit Button -->
            <button type="submit" style="padding: 10px 20px; background: #6a11cb; color: white; border-radius: 5px; border: none; cursor: pointer;">
                Create Playlist
            </button>
        </form>
    </div>
    
  
    <aside class="sidebar-right">
     
    </aside>
    
    <footer style="display: flex; flex-direction: row;">
      <div style="height: 100%; width: 22.5%;">


      </div>
      <div style="height: 100%; width: 55%; margin-top: 1%; align-items: center;">
        <div class="controls">
          <button class="btn backward-btn" style="position: relative;bottom: 30px;"><img src="{{ url_for('static', filename='images/prev.png') }}" alt = ""></button>
          <button class="play-btn pause" style="bottom: 30px;" >
              <span></span>
              <span></span>
          </button>
          <button class="btn backward-btn" style="position: relative;bottom: 30px;"><img src="{{ url_for('static', filename='images/next.png') }}"" alt = ""></button>
        </div>
        <div class="song-slider" style="bottom:20%;width: 50%; align-self: center;">
          <input type="range" value="0" class="seek-bar" style="width: 100%;">
          <span class="current-time">00:00</span>
          <span class="song-time">00:00</span>
        </div>
      </div>
      <div style="display:flex; flex-direction: row; height: 100%; width: 22.5%;">

      </div>
    </footer>
    
  </div>
  <script src="{{ url_for('static', filename='js/data.js') }}"></script>
  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    <script>
     function loadAlbum(albumName) {
        // Use the album name to create a URL
        location.href = `/userdash/album?album_name=${encodeURIComponent(albumName)}`;
    }
    </script>
   <script>
   document.addEventListener("DOMContentLoaded", function () {
    const searchInput = document.getElementById("songSearch");
    const songResults = document.getElementById("songResults");
    const songListDisplay = document.getElementById("songListDisplay");
    const selectedSongs = new Set(); // To track selected song IDs

    // Prevent Enter from submitting/reloading
    searchInput.addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
            event.preventDefault(); // Stop page reload on Enter
        }
    });

    // Fetch songs dynamically as the user types
    searchInput.addEventListener("input", function () {
    const query = searchInput.value.trim();
    console.log("Query Sent:", query);

    if (query.length > 0) {
        fetch(`http://127.0.0.1:5000/get-songs?query=${encodeURIComponent(query)}`)
    .then((response) => response.json())
    .then((data) => {
        songResults.innerHTML = ""; // Clear previous results

        // Display fetched songs dynamically
        data.songs.forEach((song) => {
            const songItem = document.createElement("div");
            songItem.textContent = song.title;
            songItem.style.cursor = "pointer";
            songItem.style.padding = "5px";
            songItem.style.color = "#fff";
            songItem.style.borderBottom = "1px solid #444";

            // Add song to the selected list when clicked
            songItem.addEventListener("click", function () {
                if (!selectedSongs.has(song.id)) {
                    selectedSongs.add(song.id); // Prevent duplicates

                    // Display the selected song
                    const li = document.createElement("li");
                    li.textContent = song.title;
                    li.style.color = "#fff";
                    li.style.padding = "5px 0";

                    songListDisplay.appendChild(li);

                    // Provide a visual cue for the selected song
                    songItem.style.backgroundColor = "#444";
                    songItem.style.color = "#6a11cb";
                }
            });

            songResults.appendChild(songItem); // Add song to results
        });
    })
    .catch((error) => console.error("Error fetching songs:", error));
}
});

});

    </script>
    
        
</body>
</html>

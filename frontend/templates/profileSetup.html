<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/registerstyle.css') }}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="background: linear-gradient(to top,#000000, #222222 50%, #333333);
height: 100vh;
margin: 0;">
    <div class="square" style="background-color: #161515; height: 800px; width: 1500px; top: 50px; left: 49.5%; transform: translateX(-50%); border-radius: 30px; box-shadow: 10px 10px 15px rgba(0, 0, 0, 0.3); position: relative; font-family: 'CustomFont', sans-serif;">
        
        <h1 style="font-family: spof; color: white; font-size: 3.5cqmax; text-align: right; position: absolute; top: 50px; left: 1000px;">
            Profile Setup
        </h1>
        
        <div class="gradient-container" style="height: 750px; width: 700px; top: 25px; left: 20px; position: absolute;">
            <img src="{{ url_for('static', filename='images/سُر_no_background (1).png') }}" style="height: 300px; width: 300px; position: absolute; top: 210px; left: 180px;">
        </div>

        <div class="form-container" style="position: relative; left: 810px; top: 180px;">
            <form action="/artistauth/profile" method="POST" style="margin-bottom: 5px;" class="upload-form">
                <div class="input-group" style="left: 180px;"">
                <textarea class="input-group__input" id="bio" name="bio" rows="5" cols="40" 
                placeholder="" maxlength="255" pattern=".{20,}" required></textarea>
                <label class="input-group__label" for="bio" style="font-family: spof; font-size: 20px;">Bio</label>
                <span class="input-group__error">Bio should be less than 255 characters and greater than 20 characters</span>
                <br><br>
                </div>  
                <div class="single-song" id="singleImage">
                    <label for="image">Select a profile message:</label>
                    <input type="file" id="image" name="image" accept="image/*">
                </div>
    
                <button type="submit" style="width: 300px; height: 50px; position: relative; left: 200px; font-family: spof; font-size: 20px; border-radius: 20px; top: -50px;">
                    Create Profile
                </button>
            </form>
            
            
        </div>
    </div>
</body>
</html>
